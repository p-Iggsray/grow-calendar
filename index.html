<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- Nothing here is for a search engine. robots.txt and the X-Robots-Tag
         header say the same thing; this is the one a crawler cannot miss. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#0c0b0a" />
    <meta name="color-scheme" content="dark" />
    <!-- Critical paint: the brand ground, the mark and the wordmark, all of it
         on screen before the bundle exists. Filled in at build (and in dev) by
         the prepaint-splash plugin in vite.config.js, from src/lib/splashPrepaint.js. -->
    <style>/* prepaint-css */</style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Black Cat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Black Cat Botanicals</title>
  </head>
  <body>
    <div id="root"><!-- prepaint --></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
